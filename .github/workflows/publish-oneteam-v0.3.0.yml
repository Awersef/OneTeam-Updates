name: Publish OneTeam Android v0.3.0

# One-time publication of the separately SHA-256 verified and permanently signed APK.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-oneteam-v0.3.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signed artifact and verify SHA-256
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-5344-8210-aac7-848accecfa6c/raw?se=2026-11-21T17%3A24%3A06Z&sp=r&sv=2026-06-06&sr=b&scid=82fa422b-5499-51d4-944b-17c398de513d&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T05%3A01%3A18Z&ske=2026-11-22T05%3A01%3A18Z&sks=b&skv=2026-06-06&sig=2YHHlRQYHxOtJZUJz%2B77hCI8U2VNkkhbkbd1TvxBIqo%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 "$ARTIFACT_URL" -o artifact.zip
          unzip -t artifact.zip
          unzip -p artifact.zip OneTeam-Android-v0.3.0.apk > OneTeam-Android-v0.3.0.apk
          echo '12c6dd5d52a4b83c993736b24c2c719cc43f4b10ae8b2b8db008aec3179c7326  OneTeam-Android-v0.3.0.apk' | sha256sum --check
      - name: Publish stable release with signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0 >/dev/null 2>&1; then
            gh release upload v0.3.0 OneTeam-Android-v0.3.0.apk --clobber
            gh release edit v0.3.0 --draft=false --prerelease=false --latest
          else
            gh release create v0.3.0 OneTeam-Android-v0.3.0.apk --target main --title 'OneTeam Android v0.3.0' --notes 'Новый фирменный значок OneTeam. Проверка обновлений из приложения: Настройки → Проверить обновления → Обновить. APK подписан постоянным ключом OneTeam, SHA-256 проверен перед публикацией.' --latest
          fi
