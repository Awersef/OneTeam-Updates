name: Publish OneTeam Android v0.3.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-oneteam-v0.3.1.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified signed APK artifact
        env:
          ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-7074-8210-b8fa-db11a82ea0f6/raw?se=2026-11-21T17%3A42%3A59Z&sp=r&sv=2026-06-06&sr=b&scid=e25e20ef-f5ef-56cd-a767-9d4b855eca94&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-21T10%3A07%3A48Z&ske=2026-11-22T10%3A07%3A48Z&sks=b&skv=2026-06-06&sig=adh5JyowWBJPO2iZI5k4vN0y/s%2BHN6NNQjqwaLeRXEA%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 "$ARTIFACT_URL" -o artifact.zip
          unzip -t artifact.zip
          unzip -p artifact.zip OneTeam-Android-v0.3.1.apk > OneTeam-Android-v0.3.1.apk
          echo '89d22650a11cede04572556dbcb97c1964c4a239b5d3aa30011089112655b04e  OneTeam-Android-v0.3.1.apk' | sha256sum --check
      - name: Publish stable v0.3.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.1 >/dev/null 2>&1; then
            gh release upload v0.3.1 OneTeam-Android-v0.3.1.apk --clobber
            gh release edit v0.3.1 --draft=false --prerelease=false --latest
          else
            gh release create v0.3.1 OneTeam-Android-v0.3.1.apk --target main --title 'OneTeam Android v0.3.1' --notes 'Исправлен значок для Samsung One UI: адаптивный значок Android с синим фоном без белых углов, безопасная зона эмблемы и поддержка тематических иконок. Проверка и установка: Настройки → Проверить обновления → Обновить. APK подписан прежним постоянным сертификатом OneTeam.' --latest
          fi
